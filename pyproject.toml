[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "registration1d"
version = "0.0.2"
description = "Linear and nonlinear registration of one-dimensional data"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Todd Pataky"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
qt = ["pyqtgraph>=0.13"]
dev = ["pytest", "jupyter", "nbformat", "nbconvert", "ipykernel"]

[project.urls]
Homepage = "https://github.com/0todd0000/registration1d"
Source = "https://github.com/0todd0000/registration1d"
Issues = "https://github.com/0todd0000/registration1d/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
registration1d = ["data/*.npz", "data/*.csv"]
