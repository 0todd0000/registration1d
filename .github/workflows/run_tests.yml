name: test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:

  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries (headless PySide6 / pyqtgraph)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libglib2.0-0 libfontconfig1

      - name: Install package with test and Qt extras
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev,qt]" PySide6

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -ra
